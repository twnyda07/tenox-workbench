<script src="payload.enc.js?v=20261008-0836"></script>
<script>
const CN='一二三四五六七八九十'.split('');
let P=null, WHO='', STATE={}, API='', TOKEN='', SYNCOK=null, SEEDADD=0;
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);
  if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 解密 ── */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const E=window.__ENC__;
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.s),iterations:E.it,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.i)},key,b64(E.c));
  const ds=new DecompressionStream('gzip');
  const txt=await new Response(new Blob([plain]).stream().pipeThrough(ds)).text();
  return JSON.parse(txt);
}
/* 後端 token：與內容解密同一個密碼，但 salt 與迭代數都不同，
   兩把鑰匙互不回推 —— 取得 token 不足以解開 payload。 */
async function deriveToken(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits(
    {name:'PBKDF2',salt:enc.encode('tenox-backend-v1'),iterations:600000,hash:'SHA-256'},km,256);
  return btoa(String.fromCharCode(...new Uint8Array(bits)));
}
$('#go').onclick=async()=>{
  const pw=$('#pw').value.trim();
  if(!pw){ $('#err').textContent='請先輸入密碼'; return; }
  /* 分開判斷，否則缺檔與密碼錯會顯示成同一個訊息 */
  if(!window.__ENC__){
    $('#err').textContent='找不到 payload.enc.js —— 這一頁必須和它放在同一個資料夾';
    return; }
  $('#err').textContent='解密中⋯';
  try{ P=await unlock(pw); }
  catch(e){ $('#err').textContent='密碼不對'; return; }
  try{ TOKEN=await deriveToken(pw); }
  catch(e){ $('#err').textContent='密碼正確，但後端 token 產生失敗：'+e.message; return; }
  start();
};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click();});

/* ── 後端 ── */
async function pull(){
  if(!API) return;
  try{ const r=await fetch(API,{method:'POST',redirect:'follow',
         headers:{'Content-Type':'text/plain;charset=utf-8'},
         body:JSON.stringify({action:'list',token:TOKEN})});
       const j=await r.json();
       if(!j.ok){ SYNCOK=null; note('雲端讀取待修，裁示仍會上傳'); render(); return; }

       const remote=j.data||{}, nR=Object.keys(remote).length, nL=Object.keys(STATE).length;
       /* 絕對不要用後端的資料「取代」本機。
          舊版寫 STATE=j.data||{} 再 save()，後端是空的時候，
          每開一次協作台就把本機裁示清空並寫回 localStorage。
          2026-10-06 使用者在 venjianhui 那台的 212 項裁示就是這樣消失的。
          寧可不同步，也不要毀掉本機資料。 */
       if(nR===0 && nL>0){
         SYNCOK=false; note(`裁示只存這台電腦（${nL} 項）`); render(); return;
       }
       STATE=Object.assign({},STATE,remote);   /* 合併，不是取代 */
       SYNCOK=true; save(); note('已同步'); render(); }
  catch(e){ SYNCOK=null; note('雲端讀取待修，裁示仍會上傳'); render(); }
}
async function push(id,rec){
  STATE[id]=rec; save(); render();
  if(!API){ note('本機已存（後端未設定）'); return; }
  note('儲存中⋯');
  /* push 的回應才是「有沒有真的上雲」的憑據——後端 list 讀不回來，
     但 set/del 是通的，所以不能用 pull 的結果來判斷。 */
  try{ const r=await fetch(API,{method:'POST',redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'set',id:id,token:TOKEN,...rec})});
       const j=await r.json().catch(()=>({}));
       if(j.ok){ SYNCOK=true;
         note('已上傳雲端 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})); }
       else { SYNCOK=false; note('上傳失敗，已存這台電腦'); render(); } }
  catch(e){ SYNCOK=false; note('上傳失敗，已存這台電腦'); render(); }
}
const save=()=>localStorage.setItem('tenox_state',JSON.stringify(STATE));
const note=t=>$('#sync').textContent=t;

/* ── 啟動 ── */
function start(){
  $('#gate').classList.add('hide'); $('#app').classList.remove('hide');
  API=(window.__API__||''); STATE=JSON.parse(localStorage.getItem('tenox_state')||'{}');
  /* 開啟時先留一份快照（保留最近 5 份），任何覆蓋都還有回頭路 */
  try{
    if(Object.keys(STATE).length){
      localStorage.setItem('tenox_bak_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,''),
                           JSON.stringify(STATE));
      const baks=Object.keys(localStorage).filter(k=>k.startsWith('tenox_bak_')).sort();
      while(baks.length>5) localStorage.removeItem(baks.shift());
    }
  }catch(e){}
  /* 後端的 list 還讀不回來，改由 build_payload.py 從試算表把兩台的裁示
     烘進 payload。本機已有的不覆蓋——正在審的人說了算。 */
  if(P.seed){
    let add=0;
    Object.keys(P.seed).forEach(k=>{ if(!(k in STATE)){ STATE[k]=P.seed[k]; add++; } });
    if(add){ save(); SEEDADD=add; }
  }
  WHO=localStorage.getItem('tenox_who')||'';
  $('#who').value=WHO;
  const whoTick=()=>{ $('#whook').textContent=WHO?'✓ '+WHO:''; $('#who').classList.toggle('ok',!!WHO); };
  whoTick();
  $('#who').oninput=e=>{WHO=e.target.value.trim();localStorage.setItem('tenox_who',WHO);whoTick();};
  const nsec=P.vols.reduce((n,v)=>n+v.chapters.reduce((m,c)=>m+c.sections.length,0),0);
  const nmat=P.vols.reduce((n,v)=>n+v.chapters.reduce((m,c)=>m+c.sections.reduce((k,s)=>k+s.m.length,0),0),0);
  const nch=(P.arch&&P.arch.vols&&P.arch.vols[0].parts)
    ? P.arch.vols.reduce((k,v)=>k+v.nch,0) : 0;
  $('#hsub').textContent=
    (nch?`新架構 B 組體例　十冊 ${nch} 章・`:'')+
    `素材池：舊撰稿本 ${nsec} 節／公案總帳 ${P.ledger.rows.length} 則`+
    `　（舊裁示 ${P.decisions.length} 項暫不處理，等架構定案）`;
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
    setView(b.dataset.v); render(); window.scrollTo(0,0);});
  pull(); render(); checkUpdate();
}

/* GitHub Pages 的 HTML 會被快取 10 分鐘，瀏覽器自己還會再留一份，
   結果是改好的東西使用者看不到（2026-10-06 就發生過）。
   這裡繞過快取抓一次自己，版本不同就請他按一下。 */
async function checkUpdate(){
  const here=(document.querySelector('meta[name=build]')||{}).content||'DEV';
  if(here==='DEV') return;
  try{
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});
    const m=(await r.text()).match(/name="build" content="([^"]*)"/);
    if(!m||m[1]===here) return;

const RV={ok:'通過',bad:'有問題',hold:'待議'};

function revStats(){
  const A=P.arch, out={};
  let done=0, tot=0;
  A.vols.forEach(v=>{
    let d=0;
    v.parts.forEach(p=>p.chapters.forEach(c=>{ if(STATE['ac'+v.n+'-'+c.num]) d++; }));
    out[v.n]={done:d, tot:v.nch}; done+=d; tot+=v.nch;
  });
  out.all={done,tot};
  return out;
}

    opts.appendChild(b);

  const box=el('div','revmore hide');

  if(rec){ const bx=el('button','ghost','取消這章的裁示');
    bx.onclick=()=>{ if(confirm('取消這一章的裁示？')){ delete STATE[id]; save(); render(); } };
    opts.appendChild(bx); }
  d.appendChild(opts);

  const ti=el('input'); ti.placeholder='改成新的章標題（留空＝不改）';
  ti.value=(rec&&rec.t)||''; ti.className='ti';
  const mv=el('select');

    `<option value="${i+1}" ${rec&&rec.mv==i+1?'selected':''}>移到第${x}冊</option>`).join('');
  const nt=el('textarea'); nt.placeholder='為什麼（給其他人看的理由）';
  nt.value=(rec&&rec.note)||'';

    mv:mv.value?+mv.value:0, note:nt.value.trim(), who:WHO, at:new Date().toISOString()});
  box.appendChild(ti); box.appendChild(mv); box.appendChild(nt); box.appendChild(sv);
  d.appendChild(box);

  if(rec&&rec.note) d.appendChild(el('div','meta','理由：'+esc(rec.note)));
  if(rec&&rec.who)  d.appendChild(el('div','meta',`${esc(rec.who)}　${esc((rec.at||'').slice(0,16).replace('T',' '))}`));
  return d;
}

/* ── 架構草案（B 組體例）── */
function mdInline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}
function mdRender(src){
  const L=src.split('\n'), out=[]; let i=0, list=null;
  const closeList=()=>{ if(list){out.push('</ul>'); list=null;} };
  while(i<L.length){
    const ln=L[i];
    if(/^\s*$/.test(ln)){ closeList(); i++; continue; }
    if(/^```/.test(ln)){ closeList(); i++;
      const code=[]; while(i<L.length && !/^```/.test(L[i])){ code.push(L[i]); i++; }
      i++; out.push('<pre class="md-pre">'+esc(code.join('\n'))+'</pre>'); continue; }
    if(/^---+\s*$/.test(ln)){ closeList(); out.push('<hr>'); i++; continue; }
    let m=ln.match(/^(#{1,6})\s+(.*)$/);
    if(m){ closeList();
      const lv=m[1].length, txt=m[2];
      const a=txt.match(/^第(.)冊/);
      out.push(`<h${lv}${a?' id="a'+'一二三四五六七八九十'.indexOf(a[1])+'"':''} class="md-h${lv}">${mdInline(txt)}</h${lv}>`);
      i++; continue; }
    if(/^\|/.test(ln)){ closeList();
      const rows=[]; while(i<L.length && /^\|/.test(L[i])){ rows.push(L[i]); i++; }
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      let html='<table>';
      rows.forEach((r,ri)=>{
        if(ri===1 && /^[\s|:-]+$/.test(r)) return;
        const tag=ri===0?'th':'td';
        html+='<tr>'+cells(r).map(c=>`<${tag}>${mdInline(c)}</${tag}>`).join('')+'</tr>';
      });
      out.push(html+'</table>'); continue; }
    if(/^>\s?/.test(ln)){ closeList();
      const q=[]; while(i<L.length && /^>\s?/.test(L[i])){ q.push(L[i].replace(/^>\s?/,'')); i++; }
      out.push('<blockquote>'+q.map(mdInline).join('<br>')+'</blockquote>'); continue; }
    /* 部：**▸ 部一　…** 單獨一行，要比章更顯眼 */
    m=ln.match(/^\*\*▸\s*(.+?)\*\*(.*)$/);
    if(m){ closeList();
      out.push(`<div class="md-part">${mdInline(m[1])}<span class="src">${mdInline(m[2])}</span></div>`);
      i++; continue; }
    m=ln.match(/^(\s*)([-*]|(\d+)\.)\s+(.*)$/);
    if(m){ const ind=m[1].length, deep=ind>=3, num=m[3];
      if(!list){ out.push('<ul class="md-l">'); list=1; }
      /* 章號一定要印出來，對照表是用章號指路的 */
      out.push(num
        ? `<li class="md-ch"><span class="chno">${num}</span>${mdInline(m[4])}</li>`
        : `<li class="${deep?'md-sub':'md-top'}">${mdInline(m[4])}</li>`);
      i++; continue; }
    closeList(); out.push('<p>'+mdInline(ln)+'</p>'); i++;
  }
  closeList();
  return out.join('');
}
let ARCHPAGE='head';   /* 'head' | 'tail' | 1..10 */
function vArch(root){

  const inbound={};                       /* 舊 key -> [本冊新章] */
  Object.keys(A.trace).forEach(k=>{

      (inbound[k]=inbound[k]||[]).push(loc); });
  });
  const keys=Object.keys(inbound).sort((a,b)=>{const[p,q]=a.split('-').map(Number),[r,s]=b.split('-').map(Number);return p-r||q-s;});

  map.appendChild(el('p','sub','點舊章可跳到「十冊撰稿本」分頁對照。括號內是本冊的新章號。'));
  const wrap=el('div','tracegrid');
  keys.forEach(k=>{
    const [ov,oc]=k.split('-');
    const a=el('a','tracechip',`舊第${CN[ov-1]}冊 ${oc} 章　<b>→ ${inbound[k].map(x=>x.split('-')[1]+' 章').join('、')}</b>`);
    a.href='javascript:void 0';
    a.onclick=()=>{ setView('book'); render(); window.scrollTo(0,0);
      setTimeout(()=>{const t=document.getElementById('v'+ov+'c'+oc); if(t)t.scrollIntoView();},60); };
    wrap.appendChild(a);
  });
  map.appendChild(wrap); body.appendChild(map);

  const box=el('div','card md');
  box.innerHTML=mdRender(`### 第${CN[v.n-1]}冊　${v.name}\n`+v.md);
  body.appendChild(box);
}

    const nm=v.chapters.reduce((k,c)=>k+c.sections.reduce((j,s)=>j+s.m.length,0),0);
    const nth=v.chapters.reduce((k,c)=>k+c.sections.filter(s=>s.thin).length,0);
    body.appendChild(el('h2',null,`第${CN[v.n-1]}冊　${esc(v.stage)}`));
    body.appendChild(el('div','card',
      `<div>${esc(v.thesis||'')}</div><p class="sub">`+
      `${v.chapters.length} 章・${v.chapters.reduce((k,c)=>k+c.sections.length,0)} 節・`+
      `${nm} 則素材${nth?`・<b style="color:var(--warn)">${nth} 節素材不足</b>`:''}`+
      (v.unplaced&&v.unplaced.length?`・${v.unplaced.length} 則未掛`:'')+`</p>`+
      `<details><summary class="sub">本冊核心法門（${v.methods.length}）</summary>`+
      v.methods.map(m=>`<p><b>${esc(m.n)}</b><span class="badge">${esc(m.r)}</span><br>
        <span class="use">${esc(m.s||'')}</span></p>`).join('')+`</details>`));
    v.chapters.forEach(c=>{
      const h=el('h3',null,`<a id="v${v.n}c${c.num}"></a>第 ${c.num} 章　${esc(c.title)}`);
      body.appendChild(h);
      /* 這一章在新架構（B 組體例）的去向 —— 兩份稿對照用 */
      const dest=(P.arch&&P.arch.trace)?P.arch.trace[v.n+'-'+c.num]:null;
      const line=el('div','tracefrom');
      if(dest&&dest.length){
        line.innerHTML='新架構 → ';
        dest.forEach((loc,li)=>{ const [nv,nc]=loc.split('-');
          if(li) line.appendChild(document.createTextNode('　'));
          const a=el('a','tracechip sm',+nv===v.n?`${nc} 章`:`第${CN[nv-1]}冊 ${nc} 章`);
          a.href='javascript:void 0';
          a.onclick=()=>{ setView('arch'); ARCHPAGE=+nv; render(); window.scrollTo(0,0); };
          line.appendChild(a); });
      } else if(P.arch&&P.arch.trace){
        line.innerHTML='<span class="nodest">新架構尚未吸收這一章</span>';
      }
      if(line.innerHTML) body.appendChild(line);
      c.sections.forEach(s=>{
        const d=el('div','sec'+(s.thin?' thin':''));
        d.innerHTML=`<h4>${esc(s.t)}<span class="badge">${s.m.length} 則</span>`+
          (s.thin?'<span class="badge w">素材不足</span>':'')+`</h4>`+
          (s.m.length?s.m.map(m=>`<div class="mat"><b>${esc(m.n)}</b>`+
            `<span class="badge">${esc(m.k)}・${esc(m.d)}</span><br>`+
            `<span class="use">${esc(m.u||'')}</span><br>`+
            `<span class="src">出處：${esc(m.s||'')}</span></div>`).join('')
            :'<p class="sub">（以法師的義理段落為主，無掛上素材）</p>');
        body.appendChild(d);
      });
    });
    if(v.unplaced&&v.unplaced.length){
      body.appendChild(el('h3',null,'本冊未掛上的素材'));
      body.appendChild(el('div','card','<table><tr><th>素材</th><th>出處</th><th>為什麼</th><th>建議移到</th></tr>'+
        v.unplaced.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.src||'')}</td><td>${esc(x.why||'')}</td>`+
        `<td>${x.suggestVol?('第'+CN[x.suggestVol-1]+'冊'):'不必移'}</td></tr>`).join('')+'</table>'));
    }
    if(v.gaps&&v.gaps!=='無') body.appendChild(el('div','card',`<b>本冊缺口</b><p class="use">${esc(v.gaps)}</p>`));
  });
  g.appendChild(side); g.appendChild(body); root.appendChild(g);
}

/* ── 公案總帳 ── */
function vKoan(root){
  const L=P.ledger, s=L.stats;
  root.appendChild(el('div','card',
    `<span class="stat">共 <b>${s.total}</b> 則</span>`+
    `<span class="stat">兩線都有 <b>${s.bothLines}</b></span>`+
    `<span class="stat">只有 Claude 線 <b>${s.claudeOnly}</b></span>`+
    `<span class="stat">只有 NotebookLM 線 <b>${s.nbOnly}</b></span>`+
    `<p class="sub">「完整敘述權」只管完整敘事放哪一冊；其餘各冊照樣可以出現，帶一句就好。跨階複現是遞進，不是錯誤。</p>`));
  const bar=el('div','filters');
  bar.innerHTML=`<input id="kq" placeholder="搜尋公案" size="22" value="${esc(F.q)}">`;
  root.appendChild(bar);
  bar.querySelector('#kq').oninput=e=>{F.q=e.target.value;clearTimeout(window._t);
    window._t=setTimeout(render,250);};
  let rows=L.rows;
  if(F.q) rows=rows.filter(r=>(r.koan+(r.ladderNote||'')).includes(F.q.trim()));
  const t=el('div','card');
  t.innerHTML='<table><tr><th>公案</th><th>出現在</th><th>完整敘述權</th><th>來源</th><th>各階分別用它講什麼</th></tr>'+
    rows.map(r=>{
      const warn=r.status==='兩線不一致·需主編定';
      return `<tr><td>${warn?'⚠️ ':''}${esc(r.koan)}</td>`+
      `<td>${(r.appearsIn||[]).join('、')}</td>`+
      `<td><b>${r.fullIn?('第'+CN[r.fullIn-1]+'冊'):'—'}</b>${r.chapter?'<br><span class="sub">'+esc(r.chapter)+'</span>':''}</td>`+
      `<td class="sub">${esc((r.source||'').replace('只有 ',''))}</td>`+
      `<td class="use">${esc(r.ladderNote&&r.ladderNote!=='無'?r.ladderNote:'')}</td></tr>`;}).join('')+'</table>';
  root.appendChild(t);
}

/* ── 人物事例 ── */
function vPpl(root){
  const all=[]; P.vols.forEach(v=>(v.people||[]).forEach(x=>all.push({...x,vol:v.n,stage:v.stage})));
  const c=k=>all.filter(x=>x.verdict===k).length;
  root.appendChild(el('div','card',
    `<span class="stat">共 <b>${all.length}</b> 則</span>`+
    `<span class="stat">保留 <b>${c('保留')}</b></span>`+
    `<span class="stat">排除 <b>${c('排除')}</b></span>`+
    `<span class="stat">待確認 <b>${c('待主編確認')}</b></span>`+
    `<p class="sub">判準：只排除「在家眾的現場／當代事例」；歷史人物、在家禪者公案、祖師公案、佛經人物、譬喻、出家眾與近代祖師一律保留。當代出家眾現場事例列「待主編確認」，請到〈待裁示〉逐則決定。</p>`));
  const bar=el('div','filters');
  bar.innerHTML=`<select id="pv"><option value="">全部冊別</option>`+
    P.vols.map(v=>`<option value="${v.n}" ${F.vol==v.n?'selected':''}>第${CN[v.n-1]}冊 ${esc(v.stage)}</option>`).join('')+
    `</select><select id="pj"><option value="">全部判定</option>`+
    ['保留','排除','待主編確認'].map(k=>`<option ${F.st===k?'selected':''}>${k}</option>`).join('')+
    `</select><input id="pq" placeholder="搜尋" size="18" value="${esc(F.q)}">`;
  root.appendChild(bar);
  bar.querySelector('#pv').onchange=e=>{F.vol=e.target.value;render();};
  bar.querySelector('#pj').onchange=e=>{F.st=e.target.value;render();};
  bar.querySelector('#pq').oninput=e=>{F.q=e.target.value;clearTimeout(window._t);
    window._t=setTimeout(render,250);};
  let list=all;
  if(F.vol) list=list.filter(x=>x.vol==F.vol);
  if(F.st) list=list.filter(x=>x.verdict===F.st);
  if(F.q) list=list.filter(x=>(x.title+(x.src||'')).includes(F.q.trim()));
  const t=el('div','card');
  t.innerHTML=`<p class="sub">${list.length} 則</p><table>`+
    '<tr><th>冊</th><th>判定</th><th>類別</th><th>事例</th><th>出處</th><th>排除後改用什麼承擔</th></tr>'+
    list.map(x=>`<tr><td>${CN[x.vol-1]}</td><td>${esc(x.verdict)}</td><td class="sub">${esc(x.cat)}</td>`+
      `<td>${esc(x.title)}</td><td class="sub">${esc(x.src||'')}</td>`+
      `<td class="use">${esc(x.replacement==='不需替代'?'':(x.replacement||''))}</td></tr>`).join('')+'</table>';
  root.appendChild(t);
}
</script>
